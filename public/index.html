<!doctype html><html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Nowoczesna strona internetowa"><title>Ładowanie…</title>
<link rel="stylesheet" href="/style.css"></head><body>
<header class="nav"><a href="/" class="logo" id="brand">NOVA</a><button id="menu">☰</button>
<nav><a href="#about">O nas</a><a href="#services">Oferta</a><a href="#why">Dlaczego my?</a><a href="#contact">Kontakt</a></nav></header>
<main>
<section class="hero"><div><span class="badge">NOWOCZESNA STRONA</span><h1 id="heroTitle"></h1><p id="heroText"></p>
<div class="actions"><a id="heroButton" class="btn primary"></a><a id="secondaryButton" class="btn secondary"></a></div></div></section>
<section id="about" class="section"><div class="heading"><span>01</span><h2 id="aboutTitle"></h2></div><div class="about"><div><p id="aboutText"></p></div><div class="stats" id="stats"></div></div></section>
<section id="services" class="section alt"><div class="heading"><span>02</span><h2 id="servicesTitle"></h2></div><div class="cards" id="services"></div></section>
<section id="why" class="section"><div class="heading"><span>03</span><h2 id="whyTitle"></h2></div><div class="cards" id="features"></div></section>
<section id="contact" class="section"><div class="heading"><span>04</span><h2 id="contactTitle"></h2></div><div class="contact"><div><p id="contactText"></p><p><strong id="email"></strong><br><span id="phone"></span></p></div>
<form id="contactForm"><input required name="name" maxlength="100" placeholder="Imię i nazwisko"><input required name="email" type="email" maxlength="200" placeholder="E-mail">
<textarea required name="message" maxlength="3000" rows="6" placeholder="Wiadomość"></textarea><button class="btn primary">Wyślij</button><p id="formStatus"></p></form></div></section>
</main><footer id="footer"></footer><script src="/app.js"></script></body></html>
